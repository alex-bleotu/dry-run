name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            script: dist:linux
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dry Run $GITHUB_REF_NAME" \
            --notes "Linux: download the AppImage, make it executable (chmod +x) and run it. Windows: run the setup exe. Dry Run compiles your C++ with g++, so install g++ (Linux) or MinGW-w64 (Windows) and make sure it is on your PATH. From 1.1.0 on, installed copies update themselves from this page. The latest*.yml and .blockmap files are for those updates."
